<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Bongabong VMS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="site-main">
  <div class="wrap wrap--narrow">
    <div class="card">
      <div class="card__body center" style="padding:56px 24px">
        <img src="assets/seal.svg" alt="" width="80" height="80">
        <h1>You are offline</h1>
        <p class="muted">This page needs a connection to the Municipal Hall system.<br>
          <em>Kailangan ng koneksyon sa internet ang pahinang ito.</em></p>
        <p class="small muted">If you are at the Municipal Hall, please ask the front desk to register your
          visit on the counter tablet.</p>
        <button class="btn btn--primary" type="button" onclick="location.reload()">Try again</button>
      </div>
    </div>
  </div>
</main>
